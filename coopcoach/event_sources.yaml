# Event sources added for everyone: universities (career, recruiting, startup and hackathon events only) and Toronto /
# Waterloo organizers. Each one answered with upcoming events when tools/discover_event_sources.py --check last ran.
# Localist URLs carry the school's own career / entrepreneurship event-type ids, so they return just those events; the
# others are filtered by keywords (events.CAMPUS_RE) and never list things aimed at staff, alumni or applicants.
#
# Schools not here (UofT's main calendar, Queen's, McMaster, York, Carleton, TMU, uOttawa, McGill, Concordia, Alberta,
# Columbia, Penn, Princeton, Georgia Tech, UIUC, Michigan, UCLA...) don't publish a calendar feed that can be read
# without signing in, and UBC turns automated readers away. Add any calendar link yourself in Settings → Sources.
sources:
