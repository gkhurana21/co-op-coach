# Niches: a whole ecosystem of companies for one kind of role, grouped into segments, so nobody misses a firm just
# because they'd never heard of it. Explore → Niches shows them; following one tracks every firm in it.
#
# Per niche:
#   season   the internship term the `opened` dates are for (tools/refresh_niches.py sets it with the dates).
# Per firm:
#   board    the careers board Co-op Coach reads directly (ats:slug, as in seed_companies.yaml). Most are already in
#            boards_discovered.yaml; following the niche adds any that aren't.
#   opened   the day that firm's first Summer 2027 internship appeared on SimplifyJobs' public list in 2026: when its
#            hiring for that summer opened. At a trading firm any internship counts; at a bank, pension fund, energy
#            company, exchange, asset manager or betting company only quant and trading roles do. Simplify often tags
#            these internships "N/A" or "Summer 2026", so those count too when they went up from June 2026 on;
#            listings open all year (more than two terms) don't. The list's history starts mid-February 2026, so
#            openings before March aren't dated. No date means none was found there: the firm may post only on its
#            own site, recruit other ways, or tag its roles too loosely to date.
#            tools/refresh_niches.py re-reads the dates each season and lists firms this file is missing.
#   canada   a Canadian office, when the firm isn't Canadian itself.
#   small    a smaller or lesser-known firm: fewer people know to apply.
# Postings and opening dates were taken from SimplifyJobs/Summer2027-Internships (listings.json, read 2026-10-14).
# The firm list was cross-checked against the Northwestern Fintech Club's public quant internship list
# (github.com/northwesternfintech/2027QuantInternships).

